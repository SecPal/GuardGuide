version = 1
SPDX-FileCopyrightText = "SecPal Contributors"

[[annotations]]
path = ["README.md", "CHANGELOG.md", "CODEOWNERS", ".github/**", "docs/**", "*.json", "*.json.license", "*.md"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["scripts/**", "setup-hooks.sh"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["artisan"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
	".editorconfig",
	".env.example",
	".gitattributes",
	".gitignore",
	".npmrc",
	".prettierignore",
	".prettierrc",
	"bootstrap/cache/.gitignore",
	"composer.lock",
	"composer.lock.license",
	"database/.gitignore",
	"lingui.config.cjs",
	"phpstan.neon",
	"phpunit.xml",
	"pnpm-workspace.yaml",
	"public/.htaccess",
	"public/robots.txt",
	"storage/app/.gitignore",
	"storage/app/private/.gitignore",
	"storage/app/public/.gitignore",
	"storage/framework/.gitignore",
	"storage/framework/cache/.gitignore",
	"storage/framework/cache/data/.gitignore",
	"storage/framework/sessions/.gitignore",
	"storage/framework/testing/.gitignore",
	"storage/framework/views/.gitignore",
	"storage/logs/.gitignore"
]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["resources/js/locales/**/messages.po"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["resources/js/locales/**/messages.mjs"]
SPDX-FileCopyrightText = "Generated by GuardGuide Lingui"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["public/apple-touch-icon.png", "public/favicon.ico", "public/favicon.svg"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["LICENSE", "LICENSES/*.txt"]
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["**/*.php", "**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.css", "**/*.blade.php"]
SPDX-FileCopyrightText = "2026 SecPal Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["resources/js/components/**", "resources/js/layouts/**"]
SPDX-FileCopyrightText = "Tailwind Labs Inc."
SPDX-License-Identifier = "LicenseRef-TailwindPlus"
