version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "composer"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
    # Bundle platform-specific optional binaries into a single PR per cycle.
    # Each per-binary bump otherwise also rewrites the root `dependencies`
    # block of `package-lock.json` (npm re-pins the optional entry there too),
    # producing duplicate-entry diffs that get reverted by the next install
    # and add review noise. Grouping keeps the lockfile churn atomic.
    # Re-evaluate if any of these graduate from `optionalDependencies`.
    groups:
      platform-binaries:
        patterns:
          - "@rollup/rollup-*"
          - "@tailwindcss/oxide-*"
          - "lightningcss-*"
    ignore:
      # eslint v10 ecosystem isn't ready: eslint-plugin-react and
      # eslint-plugin-import don't declare peer support for it yet.
      # Re-evaluate once those plugins ship eslint@^10 peer support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    groups:
      secpal-workflows:
        patterns:
          - "SecPal/.github*"
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github*"
          - "actions/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    rebase-strategy: "auto"
    target-branch: "main"
