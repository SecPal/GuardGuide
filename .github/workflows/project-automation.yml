name: Project Board Automation

on:
  issues:
    types: [opened, reopened, closed, labeled]
  pull_request:
    types: [opened, ready_for_review, closed, converted_to_draft, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  detect-project-automation-secrets:
    name: Detect project automation secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect GitHub App credentials
        id: detect
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  project-automation:
    name: Project automation
    needs: detect-project-automation-secrets
    if: needs.detect-project-automation-secrets.outputs.enabled == 'true'
    uses: SecPal/.github/.github/workflows/project-automation-core.yml@e3cdfac353f67af8350dd4e84064fdc7993e2988 # main
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  draft-reminder:
    name: Draft PR Reminder
    if: |
      github.event.pull_request != null &&
      github.event.action == 'opened' &&
      github.event.pull_request.draft == false
    uses: SecPal/.github/.github/workflows/draft-pr-reminder.yml@e3cdfac353f67af8350dd4e84064fdc7993e2988 # main
    permissions:
      issues: write
      pull-requests: write
