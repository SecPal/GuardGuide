name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@094e2c721aac83e4b0372e6edd6e7eefd0cea32b # main
    with:
      phase: '1'
      merge-method: 'squash'
