name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@57031ba8418e5febd39210a8bbcc7cb091b039a6
    with:
      phase: "1"
      merge-method: "squash"
