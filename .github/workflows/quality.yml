---
name: Quality Checks

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-files:
    name: Detect repository manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-package: ${{ steps.detect.outputs.has-package }}
      has-composer: ${{ steps.detect.outputs.has-composer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect manifest files
        id: detect
        run: |
          if [[ -f package.json ]]; then
            echo "has-package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-package=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f composer.json ]]; then
            echo "has-composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-composer=false" >> "$GITHUB_OUTPUT"
          fi

  reuse:
    name: Check REUSE Compliance
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@6f8e13a7a62cee356811a7f58d6b92119941652f

  ai-instructions:
    name: AI Instructions
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@6f8e13a7a62cee356811a7f58d6b92119941652f
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  prettier:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: Formatting Check
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434

  markdown-lint:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: Markdown Lint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  license-compatibility:
    needs: detect-files
    if: >-
      ${{
        needs.detect-files.outputs.has-package == 'true' ||
        needs.detect-files.outputs.has-composer == 'true'
      }}
    name: Check License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434

  eslint:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: ESLint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@6f8e13a7a62cee356811a7f58d6b92119941652f
    with:
      node-version: "22"

  typecheck:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: TypeScript Check
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      node-version: "22"
      build-command: "npm run typecheck"

  vitest:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: Vitest Tests
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@084b2ab764a6e6b0a865f66853e7421ff4c02434
    with:
      node-version: "22"
      build-command: "npm run test"
