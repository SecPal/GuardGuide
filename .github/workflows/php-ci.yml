name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-files:
    name: Detect PHP manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-composer: ${{ steps.detect.outputs.has-composer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect composer.json
        id: detect
        run: |
          if [[ -f composer.json ]]; then
            echo "has-composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-composer=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-composer == 'true' }}
    name: Laravel Pint
    uses: SecPal/.github/.github/workflows/reusable-php-lint.yml@009341316a3fb658874df0705306621bd4f6bb63 # main

  static-analysis:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-composer == 'true' }}
    name: PHPStan
    uses: SecPal/.github/.github/workflows/reusable-php-stan.yml@009341316a3fb658874df0705306621bd4f6bb63 # main

  test-pgsql:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-composer == 'true' }}
    name: Pest Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: php artisan test

  test-mariadb:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-composer == 'true' }}
    name: Pest Tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: testing
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -ptesting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests on MariaDB
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing
        run: php artisan test
