name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  detect-files:
    name: Detect JavaScript manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-package: ${{ steps.detect.outputs.has-package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect package.json
        id: detect
        run: |
          if [[ -f package.json ]]; then
            echo "has-package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-package=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.5
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
