name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  detect-files:
    name: Detect JavaScript manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-package: ${{ steps.detect.outputs.has-package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package.json
        id: detect
        run: |
          if [[ -f package.json ]]; then
            echo "has-package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-package=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect-files
    if: ${{ needs.detect-files.outputs.has-package == 'true' }}
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
